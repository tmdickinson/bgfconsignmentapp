{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Change password</h1>
  <form method="post">{% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}{% include "core/field.html" %}{% endfor %}
    <button class="primary">Change password</button>
  </form>
</div>
{% endblock %}
