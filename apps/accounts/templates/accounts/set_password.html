{% extends "base.html" %}
{% block title %}Set your password{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Set your password</h1>
  <p>For {{ account.login_label }}.</p>
  <form method="post">{% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}{% include "core/field.html" %}{% endfor %}
    <button class="primary">Set password</button>
  </form>
</div>
{% endblock %}
