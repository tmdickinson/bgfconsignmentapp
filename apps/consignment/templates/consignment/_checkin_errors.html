<table class="list">
  <thead><tr><th>When</th><th>Scanned</th><th>Game</th><th>Outcome</th><th>Details</th></tr></thead>
  <tbody>
  {% for e in errors %}
  <tr><td>{{ e.created_at|date:"M j, g:i A" }}</td><td><code>{{ e.scanned_code }}</code></td><td>{{ e.listing.name|default:"—" }}</td>
    <td>{{ e.get_outcome_display }}</td>
    <td>{{ e.reason }}{% if e.approved_by_admin %}<br><span class="help">Approved by {{ e.approved_by_admin.display_name }}</span>{% endif %}</td></tr>
  {% endfor %}
  </tbody>
</table>
